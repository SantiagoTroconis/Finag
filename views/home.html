<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara AR - Equipos de Fútbol</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- CDNs necesarios para MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            background: #000;
            margin: 0;
            padding: 0;
        }

        #ar-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        a-scene {
            width: 100%;
            height: 100%;
        }

        .country-flag {
            width: 30px;
            height: 20px;
            border-radius: 3px;
            margin-right: 8px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            color: white;
        }

        .pulse-btn {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .detected-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 167, 69, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            z-index: 1001;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100%);
            }

            to {
                transform: translateX(-50%) translateY(0);
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div class="position-fixed top-0 start-0 m-3" style="z-index: 1000;">
        <button class="btn btn-dark btn-sm rounded-circle p-2" onclick="location.href='start'"
            style="width: 50px; height: 50px;">
            <i class="fas fa-arrow-left"></i>
        </button>
    </div>

    <div class="position-absolute top-50 start-50 translate-middle text-white text-center" id="loading"
        style="z-index: 500;">
        <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3">Iniciando cámara AR...</p>
        <p class="small">Apunta la cámara hacia una bandera</p>
    </div>

    <!-- Overlay de detección -->
    <div id="detection-overlay" class="detected-overlay" style="display: none;">
        <i class="fas fa-flag me-2"></i>
        <span id="detected-country">País detectado</span>
    </div>

    <div id="ar-container">
        <a-scene
            mindar-image="imageTargetSrc: targets.mind; showStats: false; uiScanning: #scanning; uiError: #error; uiLoading: #loading;"
            color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">

            <a-assets>
                <a-asset-item id="brazilModelo" src="models/brazil.glb"></a-asset-item>
                <a-asset-item id="mexicoModelo" src="models/mexico.glb"></a-asset-item>
                <a-asset-item id="franceModelo" src="models/france.glb"></a-asset-item>
                <a-asset-item id="venezuelaModelo" src="models/venezuela.glb"></a-asset-item>
                <a-asset-item id="argentinaModelo" src="models/argentina.glb"></a-asset-item>
                <a-asset-item id="australiaModelo" src="models/Australia.glb"></a-asset-item>
                <a-asset-item id="canadaModelo" src="models/canada.glb"></a-asset-item>
                <a-asset-item id="ecuadorModelo" src="models/ecuator.glb"></a-asset-item>
                <a-asset-item id="inglaterraModelo" src="models/england.glb"></a-asset-item>
                <a-asset-item id="alemaniaModelo" src="models/germany.glb"></a-asset-item>
                <a-asset-item id="iranModelo" src="models/iran.glb"></a-asset-item>
                <a-asset-item id="japonModelo" src="models/japan.glb"></a-asset-item>
                <a-asset-item id="jordaniaModelo" src="models/jordania.glb"></a-asset-item>
                <a-asset-item id="spainModelo" src="models/spain.glb"></a-asset-item>
                <a-asset-item id="southkoreaModelo" src="models/south_korea.glb"></a-asset-item>
                <a-asset-item id="uzbekistanModelo" src="models/uzbekistan.glb"></a-asset-item>
                <a-asset-item id="usaModelo" src="models/usa.glb"></a-asset-item>
                <a-asset-item id="newzelandModelo" src="models/new_zeland.glb"></a-asset-item>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: true" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

            <!-- Targets para cada país -->
            <a-entity id="target-brazil" mindar-image-target="targetIndex: 0">
                <a-gltf-model src="#brazilModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-france" mindar-image-target="targetIndex: 1">
                <a-gltf-model src="#franceModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-venezuela" mindar-image-target="targetIndex: 2">
                <a-gltf-model src="#venezuelaModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-argentina" mindar-image-target="targetIndex: 3">
                <a-gltf-model src="#argentinaModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-alemania" mindar-image-target="targetIndex: 4">
                <a-gltf-model src="#alemaniaModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-ecuador" mindar-image-target="targetIndex: 5">
                <a-gltf-model src="#ecuadorModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-inglaterra" mindar-image-target="targetIndex: 6">
                <a-gltf-model src="#inglaterraModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-spain" mindar-image-target="targetIndex: 7">
                <a-gltf-model src="#spainModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-southkorea" mindar-image-target="targetIndex: 8">
                <a-gltf-model src="#southkoreaModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-uzbekistan" mindar-image-target="targetIndex: 9">
                <a-gltf-model src="#uzbekistanModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-usa" mindar-image-target="targetIndex: 10">
                <a-gltf-model src="#usaModelo" position="0 0 0" rotation="0 0 0" scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-australia" mindar-image-target="targetIndex: 11">
                <a-gltf-model src="#australiaModelo" position="0 0 0" rotation="0 90 0" scale="2 2 2"
                    animation-mixer></a-gltf-model>
            </a-entity>

            <a-entity id="target-newzeland" mindar-image-target="targetIndex: 12">
                <a-gltf-model src="#newzelandModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-iran" mindar-image-target="targetIndex: 13">
                <a-gltf-model src="#iranModelo" position="0 0 0" rotation="0 0 0" scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-japon" mindar-image-target="targetIndex: 14">
                <a-gltf-model src="#japonModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

            <a-entity id="target-canada" mindar-image-target="targetIndex: 15">
                <a-gltf-model src="#canadaModelo" position="0 0 0" rotation="0 0 0"
                    scale="0.02 0.02 0.02"></a-gltf-model>
            </a-entity>

        </a-scene>
    </div>

    <!-- Botones de control -->
    <div class="position-fixed bottom-0 start-50 translate-middle-x mb-3" style="z-index: 1000; pointer-events: auto;">
        <div class="d-flex gap-2">
            <button id="info-btn" class="btn btn-light rounded-circle p-3" onclick="showCountryInfo()"
                title="Información" style="width: 60px; height: 60px;">
                <i class="fas fa-info-circle"></i>
            </button>
            <button id="quiz-btn" class="btn btn-light rounded-circle p-3" onclick="showQuiz()" title="Trivia"
                style="width: 60px; height: 60px;">
                <i class="fas fa-question"></i> </button>
            <button id="model-btn" class="btn btn-light rounded-circle p-3" onclick="toggle3DModel()" title="Modelo 3D"
                style="width: 60px; height: 60px;">
                <i class="fas fa-cube"></i>
            </button>
            <button id="video-btn" class="btn btn-light rounded-circle p-3" onclick="showVideo()" title="Video"
                style="width: 60px; height: 60px;">
                <i class="fas fa-video"></i>
            </button>
        </div>
    </div>

    <!-- Modal de Información -->
    <div class="modal fade" id="infoModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <span id="country-flag"></span>
                        <span id="modal-country-name">Información del Equipo</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-content">
                    <!-- Contenido dinámico -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Video -->
    <div class="modal fade" id="videoModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-play-circle me-2"></i>
                        <span id="video-title">Video</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="video-container" id="video-container">
                        <!-- Video dinámico -->
                    </div>
                    <div class="d-flex justify-content-center gap-2 mt-3 overflow-auto" id="filter-controls" style="white-space: nowrap; color: #000;">
                        <button class="btn btn-primary" onclick="applyFilter('none')">Normal</button>
                        <button class="btn btn-primary" onclick="applyFilter('grayscale(100%)')">Blanco y Negro</button>
                        <button class="btn btn-primary" onclick="applyFilter('sepia(100%)')">Sepia</button>
                        <button class="btn btn-primary" onclick="applyFilter('invert(100%)')">Invertir</button>
                        <button class="btn btn-primary" onclick="applyFilter('hue-rotate(180deg)')">Psicodélico</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal de Quiz -->
    <div class="modal fade" id="quizModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <span id="quiz-country-flag"></span>
                        <span id="quiz-country-name">Pregunta sobre la Selección</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="quiz-modal-content">
                    <!-- Pregunta y opciones dinámicas -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="submit-quiz-btn">Responder</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentCountry = null;
        let modelsVisible = true;

        fetch('countries.json')
            .then(response => response.json())
            .then(data => {
                window.countryData = data;
            })
            .catch(error => {
                console.error('Error al cargar datos de países:', error);
            });


        document.addEventListener('DOMContentLoaded', function () {
            const sceneEl = document.querySelector('a-scene');

            // Eventos de MindAR
            sceneEl.addEventListener('arReady', function () {
                console.log('MindAR está listo');
                hideLoading();
                setupTargetListeners();
            });

            sceneEl.addEventListener('arError', function (event) {
                console.error('Error en MindAR:', event.detail);
                showError('Error al inicializar AR: ' + event.detail);
            });

            setTimeout(() => {
                if (document.getElementById('loading').style.display !== 'none') {
                    hideLoading();
                    setupTargetListeners();
                }
            }, 10000);
        });

        function setupTargetListeners() {
            // Configurar listeners para cada target
            const targets = [
                'brazil', 'mexico', 'france', 'venezuela', 'argentina', 'alemania',
                'ecuador', 'inglaterra', 'spain', 'southkorea', 'uzbekistan', 'usa',
                'australia', 'newzeland', 'iran', 'japon', 'canada'
            ];

            targets.forEach(country => {
                const targetEl = document.querySelector(`#target-${country}`);
                if (targetEl) {
                    targetEl.addEventListener('targetFound', () => {
                        onTargetFound(country);
                    });
                    targetEl.addEventListener('targetLost', () => {
                        onTargetLost(country);
                    });
                }
            });
        }

        function onTargetFound(country) {
            console.log(`Bandera detectada: ${country}`);
            currentCountry = country;

            // Mostrar overlay de detección
            showDetectionOverlay(countryData[country].name);

            // Habilitar botones
            enableButtons();

            // Añadir efecto visual a los botones
            addButtonEffects();
        }

        function onTargetLost(country) {
            console.log(`Bandera perdida: ${country}`);

            // Solo deshabilitar si es el país actual
            if (currentCountry === country) {
                hideDetectionOverlay();
                // Mantener botones habilitados por unos segundos
                setTimeout(() => {
                    if (currentCountry === country) {
                        disableButtons();
                        removeButtonEffects();
                        currentCountry = null;
                    }
                }, 3000);
            }
        }

        function showDetectionOverlay(countryName) {
            const overlay = document.getElementById('detection-overlay');
            const countrySpan = document.getElementById('detected-country');
            countrySpan.textContent = `${countryName} detectado!`;
            overlay.style.display = 'block';
        }

        function hideDetectionOverlay() {
            const overlay = document.getElementById('detection-overlay');
            overlay.style.display = 'none';
        }

        function enableButtons() {
            const buttons = ['info-btn', 'quiz-btn', 'model-btn', 'video-btn'];
            buttons.forEach(btnId => {
                const btn = document.getElementById(btnId);
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            });
        }

        function disableButtons() {
            const buttons = ['info-btn', 'quiz-btn', 'model-btn', 'video-btn'];
            buttons.forEach(btnId => {
                const btn = document.getElementById(btnId);
                btn.disabled = true;
                btn.classList.add('opacity-50');
            });
        }

        function addButtonEffects() {
            const buttons = ['info-btn', 'capture-btn', 'model-btn', 'video-btn'];
            buttons.forEach(btnId => {
                const btn = document.getElementById(btnId);
                btn.classList.add('pulse-btn');
            });
        }

        function removeButtonEffects() {
            const buttons = ['info-btn', 'capture-btn', 'model-btn', 'video-btn'];
            buttons.forEach(btnId => {
                const btn = document.getElementById(btnId);
                btn.classList.remove('pulse-btn');
            });
        }

        function showCountryInfo() {
            if (!currentCountry) return;

            const data = countryData[currentCountry];
            const modal = new bootstrap.Modal(document.getElementById('infoModal'));

            // Actualizar contenido del modal
            document.getElementById('country-flag').textContent = data.flag;
            document.getElementById('modal-country-name').textContent = `Selección de ${data.name}`;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
            <div class="row mb-4">
                <div class="col-md-4 text-center">
                    <div class="display-1">${data.flag}</div>
                    <h4 class="mt-2">${data.nickname}</h4>
                    <p class="text-muted">Fundada en ${data.founded}</p>
                </div>
                <div class="col-md-8">
                    <h5><i class="fas fa-trophy me-2"></i>Logros Principales</h5>
                    <div class="row g-3">
                        ${Object.entries(data.stats).map(([key, value]) => `
                            <div class="col-md-6">
                                <div class="card stat-card h-100">
                                    <div class="card-body p-3">
                                        <h6 class="card-title">${key}</h6>
                                        <p class="card-text small">${value}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="alert alert-primary">
                        <i class="fas fa-star me-2"></i>
                        <strong>Jugador destacado:</strong> ${data.bestPlayer} |
                        <strong>Estadio principal:</strong> ${data.stadium}
                    </div>
                </div>
            </div>
        `;

            modal.show();
        }

        // function takeScreenshot() {
        //     const scene = document.querySelector('a-scene');
        //     if (scene && scene.canvas) {
        //         setTimeout(() => {
        //             const link = document.createElement('a');
        //             link.download = `ar-${currentCountry || 'capture'}-${Date.now()}.png`;
        //             link.href = scene.canvas.toDataURL('image/png');
        //             link.click();

        //             // Mostrar notificación
        //             showNotification('📸 Captura guardada exitosamente!');
        //         }, 100);
        //     } else {
        //         console.error('No se pudo acceder al canvas de A-Frame');
        //         showNotification('❌ Error al capturar imagen');
        //     }
        // }

        function toggle3DModel() {
            if (!currentCountry) return;

            const targetEl = document.querySelector(`#target-${currentCountry}`);
            const modelEl = targetEl.querySelector('a-gltf-model');

            if (modelsVisible) {
                modelEl.setAttribute('visible', 'false');
                document.getElementById('model-btn').innerHTML = '<i class="fas fa-eye"></i>';
                showNotification('Modelo 3D oculto');
            } else {
                modelEl.setAttribute('visible', 'true');
                document.getElementById('model-btn').innerHTML = '<i class="fas fa-cube"></i>';
                showNotification('Modelo 3D visible');
            }

            modelsVisible = !modelsVisible;
        }

        function showVideo() {
            if (!currentCountry) return;

            const data = countryData[currentCountry];
            const modal = new bootstrap.Modal(document.getElementById('videoModal'));

            document.getElementById('video-title').textContent = `Highlights - ${data.name}`;

            const videoContainer = document.getElementById('video-container');
            videoContainer.innerHTML = `
                        <iframe
                            src="https://www.youtube.com/embed/${data.videoId}?autoplay=1"
                            title="Video ${data.name}"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                        </iframe>
                    `;
            setTimeout(() => {
                applyFilter('none'); // Resetea el filtro a normal cada vez que se abre un video
            }, 100);

            modal.show();

            // Limpiar video al cerrar modal
            document.getElementById('videoModal').addEventListener('hidden.bs.modal', function () {
                videoContainer.innerHTML = '';
            });
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'position-fixed top-0 end-0 m-3 alert alert-success alert-dismissible fade show';
            notification.style.zIndex = '1050';
            notification.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.display = 'none';
            }
        }

        function showError(message) {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.innerHTML = `
                <div class="text-danger text-center">
                    <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                    <p>${message}</p>
                    <button class="btn btn-primary mt-3" onclick="location.reload()">
                        <i class="fas fa-redo me-2"></i>Reintentar
                    </button>
                </div>
            `;
            }
        }

        function showQuiz() {
            if (!currentCountry || !countryData[currentCountry].quiz) return;

            const data = countryData[currentCountry];
            const quizData = data.quiz;
            const modal = new bootstrap.Modal(document.getElementById('quizModal'));

            // Actualizar contenido del modal del quiz
            document.getElementById('quiz-country-flag').textContent = data.flag;
            document.getElementById('quiz-country-name').textContent = `Pregunta sobre ${data.name}`;

            const modalContent = document.getElementById('quiz-modal-content');

            // Generar las opciones del quiz
            let optionsHTML = '';
            for (const [key, value] of Object.entries(quizData.options)) {
                optionsHTML += `
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="quizOption" id="option-${key}" value="${key}">
                                <label class="form-check-label" for="option-${key}">
                                    ${value}
                                </label>
                            </div>
                        `;
            }

            modalContent.innerHTML = `
                            <h5>${quizData.question}</h5>
                            <form id="quiz-form">${optionsHTML}</form>
                        `;

            modal.show();

            // Lógica para el botón de responder
            const submitBtn = document.getElementById('submit-quiz-btn');
            submitBtn.onclick = () => {
                const selectedOption = document.querySelector('input[name="quizOption"]:checked');
                if (selectedOption) {
                    if (selectedOption.value === quizData.correct) {
                        showNotification('✅ ¡Respuesta Correcta! ¡Excelente!');
                    } else {
                        showNotification(`❌ Incorrecto. La respuesta era ${quizData.options[quizData.correct]}.`);
                    }
                    modal.hide();
                } else {
                    showNotification('🤔 Debes seleccionar una opción.');
                }
            };
        }

        function applyFilter(filterValue) {
            const videoIframe = document.querySelector('#video-container iframe');
            if (videoIframe) {
                videoIframe.style.filter = filterValue;
            }
        }
    </script>
</body>

</html>
